<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="PulseFit - A modern fitness platform for strength, motivation and performance. Join now track your progress.">
    <meta name="keywords" content="PulseFit, fitness, login page, strength, health"> 
    <meta name="author" content="Fatimashahsavand">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="./styles/style.css">
    <link rel="icon" href="./icons/favicon1.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <title>PulseFit | Login</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <section class="content-left">
                <div class="content-left__wrapper">
                    <div class="content-left__hero">
                        <div class="content-text__hero">
                            <h1 class="content-left__title">Power is Built</h1>
                            <p class="content-left__text">Strength grows with discipline and consistency</p>
                        </div>
                        <img src="./images/container-img.jpg" alt="Athlete training in gym" class="content-img">
                    </div>                   
                </div>
            </section>
            <section class="content-right">
                <form action="#" class="form">
                    <h2 class="content-right__title">welcome</h2>
                    <div class="form__item">
                        <fieldset>
                        <legend>Email</legend>
                        <input type="email"  id="email" class="form__input" name="email" autocomplete="username" required autofocus>
                        </fieldset>
                    </div>
                    <div class="form__item">
                        <fieldset>
                            <legend>Password</legend>
                            <input type="password"id="password" name="password" class="form__input" autocomplete="password" required>
                        </fieldset>
                    </div>
                    <button type="submit" class="form__btn" aria-label="Log in to your account">Log in</button>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
